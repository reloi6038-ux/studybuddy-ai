<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Plan — StudyBuddy AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .plan-layout { max-width: 900px; margin: 0 auto; padding: 3rem 1rem; }
    .plan-header { text-align: center; margin-bottom: 2rem; animation: fadeInDown 500ms ease both; }
    .plan-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .day-card { margin-bottom: 1rem; animation: fadeInUp 500ms ease both; }
    .day-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; margin-bottom: 1rem; }
    .day-number { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .day-focus { color: var(--text-1); font-weight: 500; }
    .task-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: var(--bg-2); border-radius: var(--radius-sm); }
    .task-info { display: flex; align-items: center; gap: 0.75rem; }
    .task-type { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .type-learn { background: rgba(34, 211, 238, 0.2); color: var(--accent); }
    .type-practice { background: rgba(129, 140, 248, 0.2); color: var(--accent-2); }
    .type-review { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .task-duration { font-size: 0.85rem; color: var(--text-2); font-weight: 600; }
    .loading-state { text-align: center; padding: 4rem 0; }
    .loading-state .loader { width: 40px; height: 40px; border-width: 3px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand"><span class="brand-mark">📚</span><span>Study<span>Buddy</span> AI</span></a>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/tutor.html" class="nav-link">Tutor</a>
        <a href="/flashcards.html" class="nav-link">Flashcards</a>
        <a href="/quiz.html" class="nav-link">Quiz</a>
        <a href="/plan.html" class="nav-link active">Planner</a>
      </div>
    </div>
  </nav>

  <main class="plan-layout">
    <div id="setupView">
      <div class="plan-header">
        <h1>Build a <span class="gradient-text">study plan</span></h1>
        <p>Get a realistic daily schedule before your exam.</p>
      </div>
      <div class="card card-pad">
        <div id="alert" class="alert alert-error"></div>
        <form id="planForm">
          <div class="field">
            <label>Subjects (comma separated)</label>
            <input type="text" id="subjects" class="input" placeholder="e.g., Math, Physics, Chemistry" required />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="field" style="margin:0;">
              <label>Exam Date</label>
              <input type="date" id="examDate" class="input" required />
            </div>
            <div class="field" style="margin:0;">
              <label>Hours per day</label>
              <input type="number" id="hours" class="input" value="2" min="1" max="8" />
            </div>
          </div>
          <div class="field">
            <label>Weak topics (optional, comma separated)</label>
            <input type="text" id="weakTopics" class="input" placeholder="e.g., Calculus, Organic Chemistry" />
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" style="width: 100%;">Generate Study Plan →</button>
        </form>
      </div>
    </div>

    <div id="loading" class="loading-state hidden">
      <div class="loader"></div>
      <p>Designing your schedule...</p>
    </div>

    <div id="result" class="hidden">
      <div class="flex-between" style="margin-bottom: 2rem;">
        <div>
          <h1 id="planTitle" style="font-size: 1.8rem;"></h1>
          <p class="text-muted" id="planMeta"></p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="window.location.reload()">Start over</button>
      </div>
      <div id="planDays"></div>
    </div>
  </main>

  <script type="module">
    import { api } from '/js/api.js';

    const today = new Date();
    today.setDate(today.getDate() + 14);
    document.getElementById('examDate').value = today.toISOString().split('T')[0];

    const form = document.getElementById('planForm');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const setupView = document.getElementById('setupView');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('alert').className = 'alert';
      setupView.classList.add('hidden');
      loading.classList.remove('hidden');

      try {
        const response = await api.post('/api/ai/plan', {
          subjects: document.getElementById('subjects').value.split(',').map(s => s.trim()),
          examDate: document.getElementById('examDate').value,
          hoursPerDay: parseFloat(document.getElementById('hours').value),
          weakTopics: document.getElementById('weakTopics').value.split(',').map(s => s.trim()).filter(Boolean),
        });

        const data = response.data;
        document.getElementById('planTitle').textContent = data.planTitle;
        document.getElementById('planMeta').textContent = `${data.totalDays} days · ${data.dailyPlan.reduce((acc, day) => acc + day.tasks.length, 0)} tasks total`;

        document.getElementById('planDays').innerHTML = data.dailyPlan.map((day, i) => `
          <div class="card card-pad day-card" style="animation-delay: ${Math.min(i * 50, 500)}ms;">
            <div class="day-header">
              <span class="day-number">Day ${day.day}</span>
              <span class="day-focus">${day.focus}</span>
            </div>
            <div class="task-list">
              ${day.tasks.map(t => `
                <div class="task-item">
                  <div class="task-info">
                    <span class="task-type type-${t.type}">${t.type}</span>
                    <span>${t.subject}: ${t.topic}</span>
                  </div>
                  <span class="task-duration">${t.durationMinutes} min</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');

        loading.classList.add('hidden');
        result.classList.remove('hidden');
      } catch (err) {
        loading.classList.add('hidden');
        setupView.classList.remove('hidden');
        document.getElementById('alert').textContent = err.message;
        document.getElementById('alert').className = 'alert alert-error show';
      }
    });
  </script>
</body>
</html>
